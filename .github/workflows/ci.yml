name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Runs all unit tests plus the Spring context test (in-memory database, see BuildAegisApplicationTests)
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  desktop:
    name: Compile desktop wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Informational: the JavaFX desktop code is only built with -Pdesktop and needs platform-specific JavaFX artifacts
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile with the desktop profile
        run: mvn -B -ntp -Pdesktop -DskipTests compile
