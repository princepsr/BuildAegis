spring.application.name=BuildAegis
# OpenAI API Key

server.servlet.context-path=/buildaegis
spring.datasource.url=jdbc:h2:file:./data/buildaegis;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# The H2 console is a development tool: off unless BUILDAEGIS_H2_CONSOLE=true
spring.h2.console.enabled=${BUILDAEGIS_H2_CONSOLE:false}
spring.h2.console.path=/buildaegis/h2-console
buildaegis.encryption.secret=

# Never expose internals in error responses (ApiExceptionHandler returns short, sanitized messages)
server.error.include-message=never
server.error.include-exception=false
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Listen on the local machine only. Set BUILDAEGIS_BIND_ADDRESS=0.0.0.0 to expose the app (for example in a container).
server.address=${BUILDAEGIS_BIND_ADDRESS:127.0.0.1}

# Encryption of stored API keys. Leave the secret empty to use an auto-generated key file (see CryptoService).
buildaegis.encryption.key-file=./data/buildaegis.key
